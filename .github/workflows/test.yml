# approve-exec 云端测试证据（非 required：私有仓分支保护 403）。
# 本机 node v26；云端用 actions 支持的 Node 24 LTS。测试未使用 26-only API。
# 只放云端能真实跑绿的测试。依赖本机 live 路径或 Darwin 的测试不在云端跑（原 continue-on-error
# 的 test-known job 在 ubuntu 上恒红，只让 main 一直挂红叉，没有信号），改为本机运行：
#   node --test --test-force-exit tests/graph.test.mjs tests/decision-broker.test.mjs \
#     tests/selfcheck.test.mjs tests/mem-probe.test.mjs tests/e2e-dryrun.test.mjs tests/run-ledger.test.mjs
# graph / decision-broker / selfcheck 读 /Users/praise 下的 live 配置；mem-probe / e2e-dryrun / run-ledger
# 需要 Darwin sysctl/vm_stat（run-ledger 的 mutation-kill 会重跑前两者，本机约 10 分钟以上）。
# 不删用例、不改断言。
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: python continuation tests
        run: python3 -B -m unittest discover -s tests -p 'test_*continuation.py'

      - name: node scripts/run-tests.mjs
        timeout-minutes: 30
        run: node scripts/run-tests.mjs
