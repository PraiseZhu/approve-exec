# approve-exec 云端测试证据（非 required：私有仓分支保护 403）。
# 本机 node v26；云端用 actions 支持的 Node 24 LTS。测试未使用 26-only API。
# Jev D1（ubuntu_split_jobs, confidence 0.97）：ubuntu 必绿 job + continue-on-error known job。
# 不删用例、不改断言、不修 main 上已有的基线失败。
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: watcher tests
        run: node --test integrations/mivo-watcher/*.test.mjs

      - name: python continuation tests
        run: python3 -B -m unittest discover -s tests -p 'test_*continuation.py'

      - name: node scripts/run-tests.mjs
        timeout-minutes: 30
        run: node scripts/run-tests.mjs

  test-known:
    name: test-known
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # 未进必绿 job 的文件（实跑、允许红）：
      # graph / decision-broker / selfcheck：本机 /Users/praise live 路径；selfcheck --live 在 main 上已有基线失败
      # mem-probe / e2e-dryrun / run-ledger：Darwin sysctl/vm_stat，ubuntu 不可用；run-ledger mutation-kill 会重跑前两者
      - name: known host-bound / Darwin-only tests
        timeout-minutes: 30
        run: |
          node --test --test-force-exit \
            tests/graph.test.mjs \
            tests/decision-broker.test.mjs \
            tests/selfcheck.test.mjs \
            tests/mem-probe.test.mjs \
            tests/e2e-dryrun.test.mjs \
            tests/run-ledger.test.mjs
